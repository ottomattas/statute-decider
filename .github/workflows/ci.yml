name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev,solvers]'

      - name: Lint
        run: .venv/bin/ruff check src tests tools

      - name: Run tests (includes full solver-validation over all scenarios)
        run: .venv/bin/pytest -q

      - name: Validate data and export matrix
        run: |
          .venv/bin/sd validate
          .venv/bin/sd matrix export
