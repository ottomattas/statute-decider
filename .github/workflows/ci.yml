name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv framework/venv

      - name: Install dependencies
        run: framework/venv/bin/pip install -r framework/requirements.txt

      - name: Run unit tests
        working-directory: framework
        run: make test

      - name: Run scenario suite
        working-directory: framework
        run: make scenarios

      - name: Run truth-table enumeration
        working-directory: framework
        run: make truth-tables
