scenario_id: deny_register_only_plan_nonconformity
case_id: building_permit_grant
label: 'Permit: bare request, register shows plan non-conformity'
mechanism: register_only
description: Intent supplies nothing; the building register records that the project
  does not conform to the detailed spatial plan (plan_conformant false, plan_violation
  true). The register fact plan_conformant=false closes the only allow path (§ 42
  (1)) and, since Ruling I (2026-09-06, ADR 0006), stage 2 also draws the § 44 1) ground
  from the register, so deny_plan_violation fires -> DENY.
