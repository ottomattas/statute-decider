# USD per 1 million tokens; conservative working rates (higher tier when a
# model has context/peak/cache tiers). Base rates verified 2026-08-20/25,
# cache rates and fable-5.1 verified 2026-09-03 against official pricing pages.
# Keys match configs/llm/models.yaml.
#
# cached_input_usd_per_million: price of a prompt-cache hit (vendor-reported
#   cached tokens). cache_write_usd_per_million: Anthropic 5-minute cache write
#   (1.25x input); other vendors fold writes into the input price.

usd_to_eur: 0.92

models:
  gemini-2.5-flash:
    input_usd_per_million: 0.30
    cached_input_usd_per_million: 0.03
    output_usd_per_million: 2.50
    source: https://ai.google.dev/gemini-api/docs/pricing
  gpt-5-mini:
    input_usd_per_million: 0.25
    cached_input_usd_per_million: 0.025
    output_usd_per_million: 2.00
    source: https://developers.openai.com/api/docs/models/gpt-5-mini
  haiku-4.5:
    input_usd_per_million: 1.00
    cached_input_usd_per_million: 0.10
    cache_write_usd_per_million: 1.25
    output_usd_per_million: 5.00
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  deepseek-v4-flash:
    # Off-peak rates, as used for the 1 Sep paper ledgers (kept so those EUR
    # figures stay reproducible). Peak (Mon-Fri 01:00-04:00, 06:00-10:00 UTC)
    # is double. deepseek-v4-pro below is listed at peak.
    input_usd_per_million: 0.22
    cached_input_usd_per_million: 0.007
    output_usd_per_million: 0.66
    source: https://api-docs.deepseek.com/quick_start/pricing

  gemini-3.1-pro:
    input_usd_per_million: 2.00
    cached_input_usd_per_million: 0.20
    output_usd_per_million: 12.00
    source: https://ai.google.dev/gemini-api/docs/pricing
  gpt-5.6-sol:
    input_usd_per_million: 4.00
    cached_input_usd_per_million: 0.40
    output_usd_per_million: 20.00
    source: https://developers.openai.com/api/docs/pricing
  fable-5.1:
    input_usd_per_million: 10.00
    cached_input_usd_per_million: 0.25
    cache_write_usd_per_million: 12.50
    output_usd_per_million: 50.00
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  fable-5:
    input_usd_per_million: 10.00
    cached_input_usd_per_million: 1.00
    cache_write_usd_per_million: 12.50
    output_usd_per_million: 50.00
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  deepseek-v4-pro:
    # Peak rates; off-peak is half.
    input_usd_per_million: 1.32
    cached_input_usd_per_million: 0.044
    output_usd_per_million: 3.96
    source: https://api-docs.deepseek.com/quick_start/pricing
