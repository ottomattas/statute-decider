# Model registry: friendly id -> provider + API model id.
# Prices live in prices.yaml (same ids). Add a model here + a price there.

models:
  # --- cheap grid (the workhorse tier) ---
  gemini-2.5-flash:
    provider: google
    api_model: gemini-2.5-flash
    tier: cheap
  gpt-5-mini:
    provider: openai
    api_model: gpt-5-mini
    tier: cheap
  haiku-4.5:
    provider: anthropic
    api_model: claude-haiku-4-5-20251001
    tier: cheap
  deepseek-v4-flash:
    provider: deepseek
    api_model: deepseek-v4-flash
    tier: cheap

  # --- SOTA slice (verified 2026-08-25) ---
  gemini-3.1-pro:
    provider: google
    api_model: gemini-3.1-pro-preview
    tier: sota
  gpt-5.6-sol:
    provider: openai
    api_model: gpt-5.6-sol
    tier: sota
  fable-5.1:
    provider: anthropic
    api_model: claude-fable-5-1  # released 2026-09-01; forced tool_choice is a 400 on this model
    tier: sota
  fable-5:
    provider: anthropic
    api_model: claude-fable-5
    tier: legacy-sota  # superseded by fable-5.1 on 2026-09-03; kept for the 1 Sep ledgers
  deepseek-v4-pro:
    provider: deepseek
    api_model: deepseek-v4-pro
    tier: sota
