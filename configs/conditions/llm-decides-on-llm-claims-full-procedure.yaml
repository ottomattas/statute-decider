# Same as llm-decides-on-llm-claims-partial-specification, with the decide prompt stating the solver's staged
# precedence rule (solver-inputs-full-procedure). See that prompt's description.
condition: llm-decides-on-llm-claims-full-procedure
notes: >
  The architecture minus the solver. Same claim extraction as `architecture`;
  the decision step is an LLM given the solver's inputs. Difference to
  `architecture` = the value of a deterministic decider; difference to
  llm-decides-on-oracle-inputs-full-procedure = the error contributed by
  LLM grounding.

statute_text: { method: file }
text_term: { method: oracle }
term_rule: { method: oracle }
user_utterance: { method: file }
utterance_term: { method: llm, strategy: ground, prompt: ground }
term_claim: { method: llm }
registry_record: { method: file }
record_term: { method: oracle }
term_fact: { method: lookup }
premise_outcome: { method: llm, strategy: decide, prompt: solver-inputs-full-procedure }
outcome_trace: { method: skip }
fuse:
  - [utterance_term, term_claim]
logic: propositional
