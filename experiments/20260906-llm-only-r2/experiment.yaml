  refused 57/60 llm-only calls as reasoning_extraction because of it (verified 6 Sep 20:30: with the description
  dropped the identical prompt passes 3/3; with it, prose or structured justification variants were refused
  as well). strict_json_schema now drops ''description'' for every provider (Gemini and DeepSeek previously
  received the raw pydantic schema). (2) GPT-5.6''s implicit cache breakpoint sits at the end of the whole
  user message, so the shared statute prefix never matched (6 962 cached of 1.57 M tokens on 6 Sep); the
  OpenAI adapter now marks an explicit breakpoint after the statute block (settled-call cache 99-100 percent
  in pre-flight). Because the schema on the wire changed for every model, every decide cell is re-run
  so that the paper''s rows come from one configuration. Pre-flight (tools/preflight.py): 2 cells + 1
  settled cell per model checked for parse, refusal and cache read before the grid continues.


