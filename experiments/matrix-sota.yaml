# Scale run 25 Aug: SOTA slice (~5% of budget), qualitative door-closer only.
# 12 representative high-confidence scenarios (2 per case dir; 4 ALLOW, 3 DENY,
# 5 NEED_MORE_INFO) x 4 frontier models x 1 repeat = 48 calls, est ~EUR 5.
# Frontier models are injected via FRAMEWORK_*_MODEL env vars by the driver
# script (gemini-3.1-pro-preview, gpt-5.6-sol, claude-fable-5, deepseek-v4-pro);
# prices verified 2026-08-25 in experiments/prices.yaml.

label: scale-2026-08-25-sota
budget_eur: 100
repeats: 1
providers:
  - gemini
  - openai
  - anthropic
  - deepseek

experiment_ii:
  enabled: true
  scenarios:
    - civil_service_allow
    - civil_service_deny
    - consumer_withdrawal_need_user
    - consumer_withdrawal_deny
    - land_tax_allow
    - land_tax_need_db
    - journalism_deny
    - journalism_u5_need_db
    - building_permit_allow
    - building_permit_u3_no_register
    - allow
    - need-user

experiment_i:
  enabled: false
