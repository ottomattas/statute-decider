# Copy this folder to experiments/<YYYYMMDD>-<slug>/ and edit.
# Run:  sd run --experiment experiments/<folder> --execution parallel --models all

name: YYYYMMDD-slug
question: >
  One sentence: what does this experiment decide?

condition: architecture # configs/conditions/<name>.yaml
cases: all # or a list of case ids from data/cases/
models: # the declared grid; --models all resolves to this list
  - gemini-2.5-flash
  - gpt-5-mini
  - haiku-4.5
  - deepseek-v4-flash
prompts: {} # optional sweep, e.g. {utterance_term: [ground, ground-terse]} — one file per prompt, no -vN suffix
repeats: 1
temperature: 0.0
max_output_tokens: 8192
max_statute_tokens: 100000 # Ruling H: whole act if it fits, else the smallest official unit enclosing the declared provisions
budget_eur: 5.0
notes: ""
